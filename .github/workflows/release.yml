name: Prepare Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Semantic Version
      run: |
        if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid semantic version format. Must be vX.Y.Z"
          exit 1
        fi
        
    - name: Build Production Image
      run: docker build -t featureflow:latest -t featureflow:$GITHUB_REF_NAME .
      
    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        cp docker-compose.prod.yml release/
        cp .env.example release/
        tar -czvf featureflow-release-$GITHUB_REF_NAME.tar.gz release/
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: featureflow-release-*.tar.gz
        generate_release_notes: true

name: FeatureFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: featureflow
          POSTGRES_PASSWORD: featureflow_password
          POSTGRES_DB: featureflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-asyncio httpx
        
    - name: Lint with Flake8
      run: |
        flake8 app tests scripts --count --show-source --statistics
        
    - name: Run Pytest
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql+asyncpg://featureflow:featureflow_password@localhost:5432/featureflow_test
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEYS: ci_test_secret_key_override_never_use_in_prod
      run: |
        pytest tests/ -v
        
    - name: Production Certification
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql+asyncpg://featureflow:featureflow_password@localhost:5432/featureflow_test
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEYS: ci_test_secret_key_override_never_use_in_prod
      run: |
        python scripts/certify_production.py
